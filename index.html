<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10"><title>IPA Explorer v3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:950px;margin:auto;padding:24px 15px 60px}h1{font-size:clamp(29px,6vw,42px);margin:0 0 8px}.muted{color:#a4adba;line-height:1.55}
.drop{position:relative;min-height:210px;padding:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:#141922;border:2px dashed #596575;border-radius:20px}
.drop.active{border-color:#82adff;background:#182234}.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.big{font-size:48px}.drop b{font-size:22px}.pill{background:#f3f5f7;color:#111;padding:10px 17px;border-radius:12px;font-weight:bold}
.status,.card,.panel{display:none;background:#141922;border:1px solid #2d3541;border-radius:14px;margin-top:14px;padding:14px;overflow-wrap:anywhere}
.status{white-space:pre-wrap}.error{color:#ffc0c0;border-color:#884848}
.actions{display:none;gap:8px;flex-wrap:wrap;margin:14px 0}input[type=search]{flex:1;min-width:180px;padding:12px;border:1px solid #343c48;border-radius:10px;background:#141922;color:white;font-size:16px}
button{border:0;border-radius:10px;padding:10px 13px;background:#f3f5f7;color:#111;font-weight:bold}button.secondary{background:#29313d;color:white}
.row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #29313d}.row:last-child{border:0}.name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}.size{font-size:12px;color:#a4adba;white-space:nowrap}.row button{padding:7px 9px;font-size:12px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #29313d}.kv:last-child{border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto}
img{max-width:100%;max-height:55vh;margin-top:12px;border-radius:10px}.progress{display:none;height:5px;background:#28303b;margin-top:8px;border-radius:5px;overflow:hidden}.progress span{display:block;height:100%;background:#82adff;width:0}
@media(max-width:520px){main{padding:18px 12px}.size{display:none}.kv{grid-template-columns:1fr;gap:2px}}
</style></head><body><main>
<h1>📦 IPA Explorer <small style="font-size:.45em;color:#9da6b2">v3</small></h1>
<p class="muted">IPAをブラウザ内で展開して、中身を閲覧・保存します。IPAファイル自体はサーバーに送信しません。</p>
<label class="drop" id="drop"><input id="file" type="file" accept=".ipa,.zip,application/zip,application/octet-stream">
<div class="big">📦</div><b>IPAファイルを選択</b><span class="pill">ファイルを開く</span><span class="muted">iPhoneでは「ファイル」アプリからIPAを選んでください</span></label>
<div id="status" class="status" role="status" aria-live="polite"></div><div class="progress" id="progress"><span id="bar"></span></div>
<div class="actions" id="actions"><input id="search" type="search" placeholder="ファイル名・パスを検索"><button class="secondary" id="clear">解除</button><button id="savezip">展開内容をZIP保存</button></div>
<div id="app" class="card"></div><div id="list" class="panel" style="padding:0"></div><div id="preview" class="card"></div>
<p class="muted" style="font-size:13px;margin-top:18px">大きなIPAはメモリを多く使います。ZIPライブラリの読み込みにインターネット接続が必要です。アプリの署名検証やインストール機能はありません。</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),input=$("file"),drop=$("drop"),status=$("status"),actions=$("actions"),list=$("list"),app=$("app"),preview=$("preview"),search=$("search"),progress=$("progress"),bar=$("bar");
let zip=null,items=[],source=null,objectUrl=null;
function say(s,err=false){status.style.display="block";status.className="status"+(err?" error":"");status.textContent=s}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function size(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB"}
input.addEventListener("change",()=>{if(input.files&&input.files[0])openFile(input.files[0])});
["dragover","dragenter"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("active")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("active")}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer?.files?.[0];if(f)openFile(f)});
$("clear").onclick=()=>{search.value="";render()};search.addEventListener("input",render);
async function openFile(file){
source=file;zip=null;items=[];actions.style.display="none";list.style.display="none";app.style.display="none";preview.style.display="none";
if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}
if(!window.JSZip){say("ZIPライブラリを読み込めません。ネット接続を確認し、Safariでページを再読み込みしてください。CDNがコンテンツブロッカーで遮断されている可能性があります。",true);return}
say("読み込み中…\n"+file.name+" ("+size(file.size)+")");progress.style.display="block";bar.style.width="15%";
try{
const buf=await file.arrayBuffer();bar.style.width="40%";zip=await JSZip.loadAsync(buf);
zip.forEach((path,obj)=>items.push({path,obj,dir:obj.dir,size:obj.dir?0:(obj._data?.uncompressedSize||0)}));
items.sort((a,b)=>a.path.localeCompare(b.path));bar.style.width="75%";render();actions.style.display="flex";list.style.display="block";await appInfo();
bar.style.width="100%";say("読み込み完了\n"+file.name+"\n"+items.length+" 項目");setTimeout(()=>progress.style.display="none",600)
}catch(e){console.error(e);progress.style.display="none";say("展開できませんでした。IPA/ZIPの破損、または未対応の圧縮方式の可能性があります。\n詳細: "+(e.message||e),true)}
}
function render(){
const q=search.value.trim().toLowerCase(),found=items.filter(x=>x.path.toLowerCase().includes(q)),shown=found.slice(0,1500);
list.innerHTML="<div style='padding:12px 14px;color:#a4adba;font-size:13px;border-bottom:1px solid #29313d'>"+found.length+" 件（最大1500件表示）</div>";
if(!shown.length){list.innerHTML+="<div class='row' style='padding:14px'>一致するファイルなし</div>";return}
for(const x of shown){const row=document.createElement("div");row.className="row";row.style.padding="10px 12px";
const icon=document.createElement("span");icon.textContent=x.dir?"📁":"📄";
const name=document.createElement("div");name.className="name";name.textContent=x.path;row.append(icon,name);
if(!x.dir){const sz=document.createElement("span");sz.className="size";sz.textContent=size(x.size);row.append(sz);
const view=document.createElement("button");view.className="secondary";view.textContent="表示";view.onclick=()=>showPreview(x);
const dl=document.createElement("button");dl.className="secondary";dl.textContent="保存";dl.onclick=()=>download(x);row.append(view,dl)}
list.append(row)}
}
async function download(x){try{const blob=await x.obj.async("blob"),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=x.path.split("/").pop()||"file";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);say("保存を開始しました。見つからない場合はSafariのダウンロード一覧または「ファイル」アプリを確認してください。")}catch(e){say("保存エラー: "+e.message,true)}}
async function showPreview(x){
if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}preview.style.display="block";preview.textContent="プレビューを読み込み中…";
try{if(/\.(png|jpe?g|gif|webp|bmp)$/i.test(x.path)){objectUrl=URL.createObjectURL(await x.obj.async("blob"));preview.innerHTML="<b>"+esc(x.path)+"</b><br><img src='"+objectUrl+"' alt='preview'>"}
else if(/\.(txt|json|xml|plist|strings|csv|md|html|css|js|swift|m|h|entitlements)$/i.test(x.path)){const t=await x.obj.async("text");preview.innerHTML="<b>"+esc(x.path)+"</b><pre>"+esc(t.slice(0,100000))+(t.length>100000?"\n…表示上限":"")+"</pre>"}
else preview.innerHTML="<b>"+esc(x.path)+"</b><p class='muted'>この形式はプレビューできません。保存ボタンで取り出せます。</p>";
preview.scrollIntoView({behavior:"smooth",block:"nearest"})
}catch(e){preview.textContent="プレビューエラー: "+e.message}
}
async function appInfo(){
const x=items.find(x=>!x.dir&&/(^|\/)Info\.plist$/i.test(x.path));if(!x)return;
try{const b=new Uint8Array(await x.obj.async("uint8array")),d=parsePlist(b),fields=[["アプリ名",d.CFBundleDisplayName||d.CFBundleName],["Bundle ID",d.CFBundleIdentifier],["バージョン",d.CFBundleShortVersionString],["Build",d.CFBundleVersion],["最低iOS",d.MinimumOSVersion],["plist",x.path]].filter(a=>a[1]!=null&&a[1]!=="");
if(fields.length){app.style.display="block";app.innerHTML="<b>📱 アプリ情報</b>"+fields.map(a=>"<div class='kv'><span class='muted'>"+esc(a[0])+"</span><span>"+esc(Array.isArray(a[1])?a[1].join(", "):a[1])+"</span></div>").join("")}
}catch(e){console.warn("plist parse",e)}
}
function parsePlist(b){if(new TextDecoder().decode(b.slice(0,8))==="bplist00")return binaryPlist(b);
const doc=new DOMParser().parseFromString(new TextDecoder().decode(b),"application/xml"),root=doc.querySelector("plist")?.firstElementChild;return xmlVal(root)}
function xmlVal(n){if(!n)return{};if(n.tagName==="dict"){let o={},c=n.firstElementChild;while(c&&c.tagName==="key"){let k=c.textContent;c=c.nextElementSibling;if(!c)break;o[k]=xmlVal(c);c=c.nextElementSibling}return o}if(n.tagName==="array")return [...n.children].map(xmlVal);if(n.tagName==="true")return true;if(n.tagName==="false")return false;return n.textContent||""}
function uint(b,p,l){let n=0;for(let i=0;i<l;i++)n=n*256+(b[p+i]||0);return n}
function binaryPlist(b){
const n=b.length,t=n-32,os=b[t+6],rs=b[t+7],count=uint(b,t+8,8),top=uint(b,t+16,8),table=uint(b,t+24,8);if(!os||!rs||count>100000||table>=n)throw Error("plist trailer invalid");
const offsets=Array.from({length:count},(_,i)=>uint(b,table+i*os,os)),cache=new Map(),busy=new Set();
function len(p,i){if(i<15)return[i,p];const m=b[p++],bytes=1<<(m&15);return[uint(b,p,bytes),p+bytes]}
function obj(id){if(cache.has(id))return cache.get(id);if(busy.has(id)||id<0||id>=count)return null;busy.add(id);let p=offsets[id],m=b[p++],ty=m>>4,i=m&15,v=null;
if(ty===0)v=i===8?false:i===9?true:null;
else if(ty===1)v=uint(b,p,1<<i);
else if(ty===2){let bytes=1<<i;v=bytes===4?new DataView(b.buffer,b.byteOffset+p,4).getFloat32(0):bytes===8?new DataView(b.buffer,b.byteOffset+p,8).getFloat64(0):null}
else if(ty===5||ty===6){let [l,s]=len(p,i);if(ty===5)v=new TextDecoder().decode(b.slice(s,s+l));else{v="";for(let j=0;j<l;j++)v+=String.fromCharCode(uint(b,s+j*2,2))}}
else if(ty===10||ty===12){let[l,s]=len(p,i);v=[];for(let j=0;j<l;j++)v.push(obj(uint(b,s+j*rs,rs)))}
else if(ty===13){let[l,s]=len(p,i),vs=s+l*rs;v={};for(let j=0;j<l;j++)v[obj(uint(b,s+j*rs,rs))]=obj(uint(b,vs+j*rs,rs))}
busy.delete(id);cache.set(id,v);return v}
return obj(top)||{}
}
$("savezip").onclick=async()=>{if(!zip)return;const b=$("bar");progress.style.display="block";b.style.width="0";$("savezip").disabled=true;say("ZIPを作成しています…");
try{const blob=await zip.generateAsync({type:"blob"},m=>b.style.width=m.percent+"%"),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=(source?.name||"ipa").replace(/\.(ipa|zip)$/i,"")+"_contents.zip";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);say("ZIPを作成しました。Safariのダウンロード一覧を確認してください。")}
catch(e){say("ZIP作成エラー: "+e.message,true)}finally{$("savezip").disabled=false;setTimeout(()=>progress.style.display="none",700)}};
window.addEventListener("load",()=>{if(!window.JSZip)say("JSZipを読み込めません。通信を確認して再読み込みしてください。",true)});
})();
</script></body></html>
